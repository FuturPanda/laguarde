name: Publish MCP Registry metadata

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release metadata
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${VERSION}" >&2
            exit 1
          fi
          node -e '
            const pkg = require("./package.json");
            const server = require("./server.json");
            if (server.name !== pkg.mcpName) throw new Error("mcpName mismatch");
            if (server.version !== pkg.version) throw new Error("server version mismatch");
          '

      - name: Test and build
        run: |
          bun test
          bun run typecheck
          bun run build

      - name: Validate server.json schema
        run: bun run registry:validate

      - name: Verify published npm package
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          MCP_NAME="$(node -p "require('./package.json').mcpName")"
          PUBLISHED_VERSION="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version)"
          PUBLISHED_MCP_NAME="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" mcpName)"
          test "${PUBLISHED_VERSION}" = "${PACKAGE_VERSION}"
          test "${PUBLISHED_MCP_NAME}" = "${MCP_NAME}"

      - name: Install verified mcp-publisher
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz" \
            --output mcp-publisher.tar.gz
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  mcp-publisher.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
          chmod 0755 mcp-publisher

      - name: Authenticate with futur-panda.dev
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          test -n "${MCP_PRIVATE_KEY}"
          ./mcp-publisher login dns \
            --domain "futur-panda.dev" \
            --private-key "${MCP_PRIVATE_KEY}"

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Verify Registry listing
        shell: bash
        run: |
          SERVER_NAME="$(node -p "require('./server.json').name")"
          curl --fail --get --silent --show-error \
            --data-urlencode "search=${SERVER_NAME}" \
            "https://registry.modelcontextprotocol.io/v0.1/servers" \
            | jq --exit-status --arg name "${SERVER_NAME}" \
              '.servers | any(.server.name == $name)'
